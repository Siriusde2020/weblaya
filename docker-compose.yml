version: "3.8"

services:
  halo:
    image: halohub/halo:2.22
    container_name: halo
    restart: unless-stopped
    ports:
      - "${HALO_PORT:-8090}:8090"
    volumes:
      - halo-data:/root/.halo2
    environment:
      - JVM_OPTS=${JVM_OPTS:--Xmx512m -Xms256m}
      - HALO_WORK_DIR=/root/.halo2
      - SPRING_CONFIG_LOCATION=optional:classpath:/;optional:file:/root/.halo2/
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  halo-data:
    driver: local
